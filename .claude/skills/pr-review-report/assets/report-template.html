<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PR Review Report</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Prism.js — dark theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>

  <style>
    :root {
      --bg: #0e0e10;
      --bg-raised: #18181b;
      --bg-surface: #1e1e22;
      --bg-hover: #252529;
      --border: #2a2a2e;
      --border-subtle: #222225;
      --text: #e4e4e7;
      --text-secondary: #a1a1aa;
      --text-muted: #63636e;
      --accent: #6d9eff;
      --accent-dim: #2a3a5c;
      --red: #f87171;
      --red-dim: #3b1c1c;
      --amber: #fbbf24;
      --amber-dim: #3b2e10;
      --blue: #60a5fa;
      --blue-dim: #1c2e4a;
      --green: #4ade80;
      --font-sans: "DM Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "DM Mono", "Menlo", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { max-width: 820px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }

    /* ===== Header ===== */
    .header { margin-bottom: 3rem; }
    .header-label {
      display: inline-block; font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;
    }
    .header h1 { font-size: 1.6rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; line-height: 1.3; }
    .header-meta { display: flex; gap: 1.25rem; margin-top: 0.75rem; font-size: 0.8rem; color: var(--text-muted); }

    .pr-links { margin-top: 1rem; list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
    .pr-links li { font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); }
    .pr-links li::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }

    .submodule-tag {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.03em;
      padding: 0.1rem 0.4rem; border-radius: 3px; background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border);
    }

    .divider { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }

    /* ===== Section ===== */
    .section { margin-bottom: 2.5rem; }
    .section-title { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 1rem; }
    .subsection-title { font-size: 1rem; font-weight: 600; color: var(--text); margin: 2rem 0 0.75rem; }
    p { margin-bottom: 0.75rem; color: var(--text-secondary); }

    /* ===== Badges ===== */
    .badges { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.65rem; border-radius: 5px; font-size: 0.75rem; font-weight: 600; }
    .badge-critical { background: var(--red-dim); color: var(--red); }
    .badge-warning { background: var(--amber-dim); color: var(--amber); }
    .badge-info { background: var(--blue-dim); color: var(--blue); }

    /* ===== Stats Table ===== */
    .stats-table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.85rem; }
    .stats-table th {
      text-align: left; padding: 0.6rem 0.75rem; font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border);
    }
    .stats-table td {
      padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border-subtle);
      font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-secondary);
    }
    .stats-table .added { color: var(--green); }
    .stats-table .removed { color: var(--red); }

    /* ===== Review Items ===== */
    .review-item { margin: 0.75rem 0; padding: 0.9rem 1rem; border-radius: 6px; border: 1px solid var(--border); border-left: 3px solid; background: var(--bg-raised); }
    .review-item.critical { border-left-color: var(--red); }
    .review-item.warning  { border-left-color: var(--amber); }
    .review-item.info     { border-left-color: var(--blue); }
    .review-item-header { font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
    .review-item-body { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.65; }
    .review-item-body p { color: var(--text-secondary); }
    .review-item-file { margin-top: 0.4rem; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }

    /* ===== Code Blocks ===== */
    .code-block { margin: 0.6rem 0; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; }
    .code-block pre { margin: 0; font-size: 0.8rem; line-height: 1.55; background: var(--bg) !important; }
    .code-block code { font-family: var(--font-mono); }

    /* ===== Mermaid Diagrams ===== */
    .diagram-wrap { margin: 1rem 0; padding: 1.5rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-raised); overflow-x: auto; }
    .diagram-wrap .mermaid { display: flex; justify-content: center; }
    .diagram-label { font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.25rem; }
    .diagram-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; }

    /* ===== Collapsible ===== */
    details { margin: 0.5rem 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    details > summary {
      padding: 0.65rem 0.9rem; cursor: pointer; font-size: 0.85rem; font-weight: 600;
      color: var(--text-secondary); background: var(--bg-raised); user-select: none; list-style: none;
    }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "▸"; display: inline-block; margin-right: 0.5rem; font-size: 0.7rem; color: var(--text-muted); transition: transform 0.15s ease; }
    details[open] > summary::before { transform: rotate(90deg); }
    details[open] > summary { border-bottom: 1px solid var(--border); }
    details > .details-body { padding: 0.9rem; background: var(--bg-raised); }

    /* ===== Print ===== */
    @media print {
      body { background: #fff; color: #111; font-size: 10pt; }
      .container { max-width: 100%; padding: 0; }
      .section, .review-item, .diagram-wrap { break-inside: avoid; }
      .review-item { background: #fff; border-color: #ccc; }
      details > summary { display: none; }
      details > .details-body { display: block; padding: 0; background: #fff; }
    }

    /* ===== Mobile ===== */
    @media (max-width: 600px) {
      .container { padding: 1.5rem 1rem 2rem; }
      .header h1 { font-size: 1.3rem; }
      .header-meta { flex-direction: column; gap: 0.35rem; }
      .stats-table { font-size: 0.78rem; }
    }
  </style>
</head>
